version: '3.9'
services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: ./backend/.env.example
    volumes: ['./backend:/app']
    ports: ['8000:8000']
  frontend:
    build: ./frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes: ['./frontend:/app']
    ports: ['3000:3000']
    depends_on: [backend]
